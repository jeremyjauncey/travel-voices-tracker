"topic":"Hotel pre-opening strategy / demand generation / booking math / digital strategy"},{"title":"Two Types of Marketing Directors in Hospitality","text":"Is it just me or…\n…are there two completely different types of Marketing Directors in hospitality?\n\nI've had conversations recently where the contrast honestly surprised me.\n\nSame title.\nSame type of ","full_text":"Is it just me or…\n…are there two completely different types of Marketing Directors in hospitality?\n\nI've had conversations recently where the contrast honestly surprised me.\n\nSame title.\nSame type of hotel.\n\nBut completely different jobs.\n\nOne:\nLooks at data weekly.\nUnderstands the full guest journey.\nThinks beyond campaigns.\nCares about distribution, margins, AI, direct revenue.\n\nAnd then sometimes I walk into a conversation where none of that is even on the radar.\n\nThe other:\nPosts content.\nRuns a few ads.\nRelies heavily on OTAs.\nRarely zooms out to look at the system.\n\nAnd what surprises me most…\n\nThey can be working for the same category of property.\n\nLuxury, lifestyle, resort, urban.\n\nSome are preparing for where hospitality distribution is going.\n\nOthers are still operating as if it ...","url":"https://www.linkedin.com/posts/thibault-selderslagh_is-it-just-me-or-are-there-two-completely-activity-7430321773092462592-v6hb","format":"text","date":"February 19, 2026","likes":58,"comments":23,"total":81,"hook_line":"Is it just me or…","hook_category":"news_announcement","cta_text":"Others are still operating as if it hasn't shifted.\nAm I the only one noticing this?","cta_categories":["question_engagement"],"effectiveness":"Classic 'provocative observation' format that drives engagement through audience self-identification. Works because: (1) the 'Is it just me or...' opener is a low-friction way to make a provocative claim; (2) creates a binary that most readers immediately classify themselves into; (3) the contrast s...","topic":"Hospitality marketing leaders ithmic reach. Taps into the hottest topic in digital marketing right now (AI search repl...","topic":"AI discoverability / GEO (Generative Engine Optimisation) for hotels"},{"title":"Guests don't compare hotels — they simulate the stay","text":"Guests don't compare hotels the way hotels think they do.\nThey don't line up photos and pick the prettiest one.\nThey simulate the stay.\nSubconsciously.\n\nThey ask:\n– Where will I wake up?\n– Where will ","full_text":"Guests don't compare hotels the way hotels think they do.\nThey don't line up photos and pick the prettiest one.\nThey simulate the stay.\nSubconsciously.\n\nThey ask:\n– Where will I wake up?\n– Where will I have my coffee?\n– How far is everything from everything else?\n– Will this feel calm… or awkward?\n\nPhotos are inputs.\nVideo is a mental walkthrough.\n\nIt lets the brain rehearse the experience.\n\nThat's why video converts better than static:\nNot because it's richer content,\nbut because it mirrors how humans decide.\n\nA sequence beats a snapshot.\nMovement beats perfection.\nContext beats aesthetics.\n\nThis is why:\n• Room walkthroughs outperform hero imagery on booking pages\n• Day-in-the-life videos reduce comparison shopping\n• Guests who watch video make faster decisions\n\nYou're not selling a room....","url":"https://www.linkedin.com/posts/hollyannephillips_guests-dont-compare-hotels-the-way-hotels-activity-7412872583357980673-9q4Y","format":"text with embedded video (Grand Tour walkthrough)","date":"January 2, 2026","likes":114,"comments":21,"total":135,"hook_line":"Guests don't compare hotels the way hotels think they do.","hook_category":"contrarian","cta_text":"Video makes them ready.\nWhat do you think? Do you think a Grand Tour would help hotel guests decide where to book?","cta_categories":["comment_trigger"],"effectiveness":"Opens with a contrarian insight ('they don't compare, they simulate') that forces the reader to reframe their mental model — a classic high-engagement LinkedI d the recruitment process clearly detailed at the bott...","url":"https://www.linkedin.com/posts/hollyannephillips_for-digital-sakes-activity-7287456221882671104-ZesO","format":"text","date":"January 21, 2025","likes":36,"comments":8,"total":44,"hook_line":"Yesterday we posted a job for a content marketing manager and the results/interactions have been very insightful.","hook_category":"statement","cta_text":"And for those who haven't used video screening what are your thoughts?\n#hiring #contentmarketingmanager","cta_categories":["comment_trigger","email_cta"],"effectiveness":"Behind-the-scenes data (1,000 views, 300 applications in 24 hours) makes this feel like primary research, not opinion. The human HR angle — rare for a marketing agency founder — broadens reach beyond hospitality audiences. Showing the 'how we do things differently' builds brand culture in public, at...","topic":"Recruitment transparency / video screening process behind the scenes"},{"title":"7 shifts in guest expectations in 2025","text":"Stop giving guests what you think they want. Start giving them what they actually value. And this is why segmenting your audience and aligning with what they want and are interested in most is no long","full_text":"Stop giving guests what you think they want. Start giving them what they actually value. And this is why segmenting your audience and aligning with what they want and are interested in most is no longer optional.\n\nHere are the 7 shifts shaping guest expectations (and why they matter):\n\nFrom perks → to presence\nChampagne on arrival is nice, okay I'll admit it. But what guests really value is how they feel while they're with you. It's about presence; the sense that a hotel sees them, anticipates their needs and makes space for them to be in the moment.\n\nFrom amenities → to rituals\nHotels have long sold access to gyms, spas and pools. Now the question is: what do guests do there? A morning plunge, a tea ritual, an evening wind-down routine; these daily anchors turn amenities into meaningful m...","url":"https://www.linkedin.com/posts/hollyannephillips_7-shifts-in-guest-expectations-in-2025-activity-7378778585492422656-D2Wa","format":"text","date":"September 30, 2025","likes":0,"comments":42,"total":42,"hook_line":"Stop giving guests what you think they want. Start giving them what they actually value. And this is why segmenting your audience and aligning with what they want and are interested in most is no longer optional.","hook_category":"contrarian","cta_text":"So what is your meaning? What are your guests coming for?\n👉 Which of these shifts do you see guests asking you for most often? And which did we miss?","cta_categories":["comment_trigger","follow_subscribe"],"effectiveness":"The 'X shifts' framework is one of LinkedIn's most reliably high-engagement formats. The arrow-notation (From X → to Y) makes each point instantly scannable and shareable. The conversational asides ('Sorry I know I'll get a lil hate for this') make Holly feel human and approachable rather than preac...","topic":"Guest expectation shifts / hospitality industry trends 2025"},{"title":"Named Top 100 Digital Thought Leaders in Global Hospitality (No. 50)","text":"Honoured to be named one of the Top 100 Digital Thought Leaders in Global Hospitality.\n\nThe International Hospitality Institute (IHI) and Dr. Jeffrey O announced their first award of 2026 and to be in","full_text":"Honoured to be named one of the Top 100 Digital Thought Leaders in Global Hospitality.\n\nThe International Hospitality Institute (IHI) and Dr. Jeffrey O announced their first award of 2026 and to be included, and to land at No. 50, is something I'm genuinely humbled by.\n\nSince August, I've shown up here every weekday, posting, thinking out loud, asking questions and doing my best to add something useful to the conversation around hospitality, digital and how our industry is evolving.\n\nNot to chase algorithms. Not to be loud. But to be considered, helpful and to drive interesting dialogue.\n\nTo be acknowledged alongside people who have spent decades shaping this industry feels meaningful especially while I'm still very much building.\n\nAnd to those on this list thanks for being so inspiring an...","url":"https://www.linkedin.com/posts/hollyannephillips_honoured-to-be-named-one-of-the-top-100-digital-activity-7422686319891415040-n4DB","format":"text","date":"January 29, 2026","likes":0,"comments":25,"total":25,"hook_line":"Honoured to be named one of the Top 100 Digital Thought Leaders in Global Hospitality.","hook_category":"list_framework","cta_text":"Thank you to everyone who reads, challenges, comments, messages privately, or simply takes something away and applies it in their own work. That's the part that matters most to me and us - because it's a team effort at For Digital Sakes\nHere's to sharing generously, thinking critically and continuin...","cta_categories":["comment_trigger"],"effectiveness":"Award announcement posts receive high congratulatory comment volume from network, which boosts LinkedIn algorithmic reach. Holly's approach is notably humble — she gives credit to consistency and the community, not self-promotion — which makes it more shareable and avoids the backlash that pure brag...","topic":"Award announcement / thought leadership recognition / personal milestone"},{"title":"30 questions in 30 days — fix your 2026 guest journey","text":"30 questions in 30 days. Fix these, and your 2026 guest journey will outperform any marketing campaign you run.\n\nWe say 'improve 1% every day' about ourselves… But some hotels forget it applies to the","full_text":"30 questions in 30 days. Fix these, and your 2026 guest journey will outperform any marketing campaign you run.\n\nWe say 'improve 1% every day' about ourselves… But some hotels forget it applies to their guest journey too. Fix one thing a day for 30 days and you won't recognise your 2026 results\n\nHere are the 30 questions to guide you each day until the end of the year!\n\n1. Are we discoverable where our guests actually search?\n2. Does our content make people feel something, or just inform?\n3. Does our website load in under 3 seconds?\n4. Do we explain value before price?\n5. Is our brand story clear within the first 8 seconds?\n6. Is our room page built to convert or is it just pretty?\n7. Do we answer the 5 objections every guest has?\n8. Is our photography consistent across platforms?\n9. Do ou...","url":"https://www.linkedin.com/posts/hollyannephillips_30-questions-in-30-days-fix-these-and-your-activity-7401309824027705344-RLEv","format":"text with numbered list","date":"December 1, 2025","likes":0,"comments":24,"total":24,"hook_line":"30 questions in 30 days. Fix these, and your 2026 guest journey will outperform any marketing campaign you run.","hook_category":"statement","cta_text":"If you want help applying this, send me a message.\nWhat else would be on your check list before the year is up?","cta_categories":["comment_trigger","email_cta","follow_subscribe"],"effectiveness":"High shareability due to the practical '30 days' angle that aligns perfectly with year-end planning timing (posted December 1, 2025). Each question is a self-diagnostic that makes hotel marketers feel the gap between where they are and where they should be — driving DM inquiries and comments. The im...","topic":"Hotel guest journey audit / 30 questions for 2026 planning"},{"title":"Integrity isn't a buzzword — human-first business values","text":"Integrity isn't a buzzword. It's a baseline.\n\nAt For Digital Sakes, we lead with a human-first approach not because it looks good, but because it feels right. And over time, it's made one thing really","full_text":"Integrity isn't a buzzword. It's a baseline.\n\nAt For Digital Sakes, we lead with a human-first approach not because it looks good, but because it feels right. And over time, it's made one thing really clear: You can't fake values.\n\nWe've worked with incredible brands, but what sets the best partnerships apart isn't budget or clout, it's alignment. Shared standards. Mutual respect. A sense that everyone's rowing in the same direction, with heart.\n\nLuxury, for us, isn't a label it's a mindset. It's how you show up. It's how you treat people. And it applies not just to clients, but to collaborators, freelancers, and every conversation in between.\n\nWe hold ourselves to that standard. We seek out people who do the same. And we walk away from what doesn't align even when it's hard.\n\nIf that reso...","url":"https://www.linkedin.com/posts/hollyannephillips_business-businessvalues-luxuryhospitality-activity-7351563843615031296-SXWQ","format":"text","date":"July 17, 2025","likes":14,"comments":0,"total":14,"hook_line":"Integrity isn't a buzzword. It's a baseline.","hook_category":"contrarian","cta_text":"Because how you do business is the most honest brand statement you can make, don't you think?\n#business #businessvalues #luxuryhospitality","cta_categories":["question_engagement"],"effectiveness":"Lower engagement compared to tactical posts, but performs an important trust-building function. Personal values posts attract clients who self-identify with the same values — a quality-over-quantity lead generation play. The 'luxury is a mindset, not a label' line is quotable and shareable in DMs. E...","topic":"Business values / human-first agency philosophy"},{"title":"Digital marketing as foundation, not decoration","text":"Everyone says they want 'digital marketing.' But what they really mean is:\n✨ a few Instagram posts\n✨ a paid campaign two weeks before opening\n✨ a last-minute influencer stay\n\nSorry but that's not stra","full_text":"Everyone says they want 'digital marketing.' But what they really mean is:\n✨ a few Instagram posts\n✨ a paid campaign two weeks before opening\n✨ a last-minute influencer stay\n\nSorry but that's not strategy. That's decoration.\n\nTrue digital marketing is infrastructure. It's positioning, storytelling, demand generation, and conversion design. It's psychology, data, and emotion working in sync.\n\nIt's the difference between a hotel that opens to silence and one that opens to a waitlist and booked out restaurants and rooftop bars.\n\nBut here's the thing ↓\nYou don't build that in a month. You build it months out. You build it through aligned messaging, consistent visibility and a plan that starts the moment the vision is approved.\n\nThe problem isn't that brands don't want digital. It's that they t...","url":"https://www.linkedin.com/posts/hollyannephillips_digitalmarketing-hotelopening-preopening-activity-7359267000134623232-DqdS","format":"text","date":"August 7, 2025","likes":0,"comments":0,"total":0,"hook_line":"Everyone says they want 'digital marketing.' But what they really mean is:","hook_category":"bold_claim","cta_text":"Please stop making digital a feature when it really should be your foundation.\nWhich hotel openings do you think nailed pre opening digital strategies?","cta_categories":["comment_trigger"],"effectiveness":"The hook ('Everyone says they want digital marketing. But what they really mean is…') is a classic pattern-interrupt that names what prospects often do wrong, making them feel seen and defensive simultaneously — driving comments. The 'decoration vs infrastructure' reframe is a memorable binary that ...","topic":"Pre-opening digital strategy / digital marketing as infrastructure not decoration"},{"title":"Most hotels are doing decoration, not personalisation","text":"Most hotels aren't doing personalisation they're doing decoration.\n\nPersonalisation isn't a thank-you note. It's not a 'Dear Guest' card on arrival or a fruit platter... Those are gestures, not strate","full_text":"Most hotels aren't doing personalisation they're doing decoration.\n\nPersonalisation isn't a thank-you note. It's not a 'Dear Guest' card on arrival or a fruit platter... Those are gestures, not strategy.\n\nReal personalisation goes deeper. It's understanding your guest's rhythms, preferences, behaviours and even their biology. We're entering an experience era apparently, which should be shaped by:\n• custom-crafted menus based on intolerances and nutrition\n• wellness programs informed by biomarkers and nervous-system needs\n• AI-powered itineraries based on mood, energy, and travel style\n• spaces designed for sensory regulation, not aesthetics\n• micro-gestures that anticipate what a guest needs before they ask\n\nThis should be where hospitality is at! But it's not!\n\nAnd while our industry is s...","url":"https://www.linkedin.com/posts/hollyannephillips_most-hotels-arent-doing-personalisation-activity-7401659930136551424-_Rn2","format":"text with video clip embed (podcast episode clip)","date":"December 2, 2025","likes":0,"comments":0,"total":0,"hook_line":"Most hotels aren't doing personalisation they're doing decoration.","hook_category":"contrarian","cta_text":"🎙️ Full episode of The Digital Concierge now live on Spotify & YouTube.\nWhat do you think is hospitality moving fast enough, orrrr is personalisation still stuck in the past?","cta_categories":["comment_trigger"],"effectiveness":"Uses the same 'decoration vs real thing' framing as her pre-opening post — a consistent vocabulary that builds brand recognition. The 'hospitality is behind other industries' angle is a challenge to the ego of hotel professionals, which provokes defensive comments and debate — high engagement signal...","topic":"Hotel personalisation gap / real vs superficial personalisation"}]},{"slug":"jalil-mekouar","name":"Jalil Mekouar","title":"Founder & CEO at inHovate Solutions - Hospitality Technology, Management & Investment - Global Advisory Board Member & Thought Leader/Speaker","company":"inHovate Solutions","location":"United Arab Emirates","linkedin":"https://www.linkedin.com/in/jmekouar","followers":19057,"followers_display":"19,057 followers","bio":"35+ years in hospitality across 35 countries/6 continents.  opinion; 'unfiltered' hook promises candor","topic":"Hospitality trends 2026"}]}],"jeremy_posts":[{"date":"2026-02-09 12:54:17","url":"https://www.linkedin.com/feed/update/urn%3Ali%3Ashare%3A7426609385470128128","full_text":"Last week, Kerry Healy wrote an article about something I think a lot of hospitality brands still underestimate.\n\nThe shift from simply showing a place to helping someone feel it. And that shift matters a lot more than most brands realise.\n\nKerry talked about how a single piece of visual content changed how she saw Dubai. Instead of a checklist of landmarks, it became a place with layers and moments that you don’t always get from a brochure, and that really resonated with me because it’s the exact shift we’ve been building towards for years.\n\nAnd it’s exactly the thinking that sits behind the strategic partnership between Beautiful Destinations and Accor - to reshape consumer perceptions and enhance brand visibility through dynamic and personalised content creation. Our ‘From Dusk To Dawn’...","word_count":377,"visibility":"MEMBER_NETWORK"},{"date":"2026-02-09 10:12:07","url":"https://www.linkedin.com/feed/update/urn%3Ali%3Ashare%3A7426568571519930368","full_text":"France has officially secured its spot as the most visited destination in 2025, but it’s currently ranking 4th for tourism spend. \n\nDespite welcoming 28.6M less people, the U.S. generated roughly $138B more in tourism spend than France according to the latest data available. \n\nThat gap is huge, and I think it tells us a few very important things about tourism: \n\n→  High-spend travellers beat high volume. \nThe top-earning destinations prioritise long-haul visitors, longer stays and higher daily spend. Countries like the U.S., Australia and the UK benefit from travellers who spend across retail, food, entertainment and experiences.\n\n→  Tourism works best when it serves multiple purposes. \nThe strongest economies don’t rely on leisure alone. They combine tourism with business travel, educatio...","word_count":293,"visibility":"MEMBER_NETWORK"},{"date":"2026-02-09 10:10:28","url":"https://www.linkedin.com/feed/update/urn%3Ali%3Ashare%3A7426568160188989440","full_text":"For a long time luxury travel has been defined by speed. How far you could go, how fast you could get there and how many places you could tick off. But I think that definition is broken. \n\nRail and slow travel are rising because time itself has become a luxury. \n\nExplore’s 2026 travel trends show rail journey bookings jumped 77% within just 12 weeks, and forward bookings are up 41% year-on-year 👏\n\nThe appeal is about the autonomy of the experience. People want more control of their own experience, and rail is a deliberate choice that facilitates that, and I think we’re going to see a lot more of it this year. \n\nBecause rail offers something flights increasingly can’t:\n\n→ Your journey is part of the trip, not dead time between destinations\n→ City-centre to city-centre travel and fewer frict...","word_count":343,"visibility":"MEMBER_NETWORK"},{"date":"2026-02-09 10:09:04","url":"https://www.linkedin.com/feed/update/urn%3Ali%3AugcPost%3A7426567807158558720","full_text":"Vienna’s tourism board just flew the entire Scottish village of ‘Dull’ all the way to Vienna to prove its country wasn’t boring 👏\n\nIn 2026, whilst every other city is fighting to be the most vibrant or exciting, Vienna leaned into the accusation that it might be ‘boring’ and turned it into a global campaign.\n\nBy flying an entire village to experience the city during its ‘low’ season, Vienna conducted a live public trial of its brand promise. They handed the keys to the city over to the people from Dull and let them decide, publicly, whether the city lived up to its reputation.\n\nEvery resident was given a full itinerary tailor-made for them based on their interests and the cultural experiences Vienna has to offer.\n\nThe verdict? A unanimous and definitive conclusion that ‘Vienna is definitel...","word_count":218,"visibility":"MEMBER_NETWORK"},{"date":"2026-02-06 10:12:32","url":"https://www.linkedin.com/feed/update/urn%3Ali%3AugcPost%3A7425481514261438464","full_text":"Malaysia just placed one of the boldest bets I’ve seen from a destination heading into 2026.\n\nAt first glance, Visit Malaysia 2026 looks like a classic big-budget tourism push - a major launch in London, a RM550m investment, 35+ million arrival targets and 300+ events planned for this year.\n\nBut underneath that headline ambition, I think something more interesting is happening.\n\nA very deliberate shift in strategy from volume to value.\n\nWhat Malaysia is signalling is a shift away from low-yield mass tourism towards demand that’s slower and more intentional.\n\nEco-tourism is rooted in biodiversity, food culture as a global differentiator, longer stays from European markets and emerging categories like wellness and medical travel.\n\nThis is a high-stakes move because value-led tourism is slowe...","word_count":223,"visibility":"MEMBER_NETWORK"},{"date":"2026-02-02 12:47:31","url":"https://www.linkedin.com/feed/update/urn%3Ali%3Ashare%3A7424070964075859968","full_text":"Right now, everyone’s racing to rebuild their travel strategies around AI, but 75% of travellers still don’t trust AI. \n\nI use AI all day everyday and it is brilliant at helping people think about travel, but it’s still struggling to help them commit. \n\nWhat we’re seeing is a disconnect between discovery and transaction. \n\nTravellers are happy to use AI to explore destinations and narrow down options, but when it actually comes to booking flights or hotels, trust drops quickly. According to Insider Travel Report, less than 20% of U.S. markets trust AI for transactions, and IDC has predicted that by 2030, only 30% of travel bookings will be completed by AI agents.\n\nI don’t think this is a technology problem, but more of a human nature and accountability one. \n\nWhen something goes wrong in t...","word_count":378,"visibility":"MEMBER_NETWORK"},{"date":"2026-02-02 12:46:42","url":"https://www.linkedin.com/feed/update/urn%3Ali%3Ashare%3A7424070762078195712","full_text":"A lot of people question whether tourism marketing is a cost or an investment, but I think the team at Tourism Australia have answered that question pretty convincingly. \n\nWith Black Summer bushfires in 2019, followed by an almost immediate global shutdown, Australian tourism has seen some of the toughest conditions our industry has faced. But instead of pulling back during difficult conditions, backed by Tourism Australia’s CMO Susan Coghill, they doubled down. \n\nFive years on and I think the results speak for themselves 👏\n\nAustralia has welcomed over 8 million visitors, delivered a $14 return for every $1 spent on marketing and is now tracking towards 10 million arrivals, with 11.8 projected by 2029. \n\nSusan has been instrumental in driving this growth through various initiatives, includ...","word_count":335,"visibility":"MEMBER_NETWORK"},{"date":"2026-02-02 10:18:05","url":"https://www.linkedin.com/feed/update/urn%3Ali%3AugcPost%3A7424033361066901506","full_text":"It feels like a very proud moment to celebrate Dubai being named the World’s Leading Sustainable City by the World Sustainable Travel & Hospitality Awards 👏\n\nHaving lived and worked here for the past five years, this recognition feels especially meaningful because I’ve seen up close that outcomes like this don’t come from quick wins or one-off initiatives. \n\nSomething that’s always stood out to me about Dubai is its consistency of intent. Sustainability has been built into Dubai’s infrastructure, policy and long-term positioning for a long time, and you can see it in the scale of ambition from Dubai Reef becoming the world’s largest reef development to the continued expansion of the Mohammad bin Rashid Solar park. \n\nThe same applies to planning. Initiatives like the Dubai 2040 Urban Master...","word_count":305,"visibility":"MEMBER_NETWORK"},{"date":"2026-01-30 10:13:25","url":"https://www.linkedin.com/feed/update/urn%3Ali%3AugcPost%3A7422945022368468992","full_text":"Thailand has just done something very few destinations are brave enough to do. \n\nInstead of using creators to promote the country, it’s invited them to help define what the country stands for. \n\nThe Tourism Authority of Thailand's new Co-Creator Programme is a clear signal that destination marketing has moved beyond influencer campaigns towards something much more powerful: creator-led demand creation. \n\nThrough this programme, creators are aligned to specific routes and themes - wellness, culture, healing, reconnection - and trusted to interpret and translate those experiences through their own lens. \n\nThat’s a big shift, because it turns creators from amplifiers into co-authors.  \n\nWhat I think is really smart about this is the intent behind it, using creators as a distributed network of...","word_count":237,"visibility":"MEMBER_NETWORK"},{"date":"2026-01-28 08:55:24","url":"https://www.linkedin.com/feed/update/urn%3Ali%3AugcPost%3A7422200613041729538","full_text":"Most luxury travel brands think their experience starts in the lobby. But the smart ones have realised how that definition is outdated.\n\nWhat we traditionally thought hospitality experiences were is no longer the same. Competition for the luxury hotel guest is extending beyond the lobby to the tarmac, rail tracks and seaports.\n\nTake Aman’s new Jet Expeditions. Their 2026 Around the World in Three Continents journey is a 21-night journey across Japan, the Philippines, Indonesia, Sri Lanka, Dubai, Italy and Morocco. But I don’t think the destinations are the real product here, I think it’s the fantastic experience between them.\n\nWhat’s interesting is this isn’t happening in isolation.\n\nAcross the luxury end of the market, hospitality brands are extending their competitive arena far beyond ho...","word_count":324,"visibility":"MEMBER_NETWORK"},{"date":"2026-01-26 08:49:14","url":"https://www.linkedin.com/feed/update/urn%3Ali%3AugcPost%3A7421474285132746752","full_text":"America isn’t just preparing for a World Cup year in 2026. It’s preparing to bridge the gap between its iconic host cities and regional tourism growth. \n\nBrand USA’s ‘America the Beautiful’ campaign is one of the most strategically timed destination campaigns I’ve seen for a while. The campaign was released just as the U.S. is about to experience an unprecedented period of global attention. With the FIFA World Cup expected to generate 1.2M+ international visitors, America’s 250th anniversary and the Route 66 Centennial all happening within 2026, the challenge isn’t just awareness, but intent. \n\nAnd that’s where this campaign is smart. \n\nRather than selling the U.S. as a checklist of landmarks, America the Beautiful reframes the country as a shared emotional experience. It shifts the propos...","word_count":345,"visibility":"MEMBER_NETWORK"},{"date":"2026-01-26 08:37:37","url":"https://www.linkedin.com/feed/update/urn%3Ali%3Ashare%3A7421471359995744256","full_text":"I am fascinated by how quickly travel marketing is changing with AI. \n\nI know I’m writing about it a lot on LinkedIn, but it’s largely because today reminds me so much of a decade ago, when social media was changing how consumers discovered travel, and travel marketers were slow to react.\n\nLast week, OpenAI confirmed it was testing ads inside ChatGPT and I think the impact for us in travel will be profound.\n\nLLMs don’t sit at the end of the journey like search or OTAs. They’re right up at the start, with social. They sit at what I think is the most influential moment of all: when someone is forming their mental shortlist and looking for what is possible. \n\nFor many of us, they are far, far better than what we’ve been used to. At the discovery stage of travel when I don’t know exactly where...","word_count":453,"visibility":"MEMBER_NETWORK"},{"date":"2026-01-22 08:39:07","url":"https://www.linkedin.com/feed/update/urn%3Ali%3Ashare%3A7420022189292142592","full_text":"Most travel content gets liked, but very little of it actually gets someone to book. So how do you close that gap?\n\nTravel content has moved from aspiration to action, and for the first time, that journey is measurable.\n\nCurrently, aspirational, ‘dreaming’ style content, which is emotional and shows a destination’s essence in a digestible way, is driving the most passive engagement on social media. But it’s not where decisions are made.\n\nDecisions are made inside ‘planning’ content that helps users decide where to visit, what to do and how to do it. This kind of content focuses on tangible value and advice, such as itineraries or local guides, and it’s generating far more saves than any other kind of travel content on social media right now, which has become the strongest signal of intent ...","word_count":329,"visibility":"MEMBER_NETWORK"},{"date":"2026-01-21 10:56:08","url":"https://www.linkedin.com/feed/update/urn%3Ali%3AugcPost%3A7419694281675722752","full_text":"Google’s live translation update might look like a small AI feature to most. For travel, it’s anything but. It’s a great example of another development in what AI can do, but I think its real significance for travel lies in its cultural impact. \n\nI grew up with a Spanish-speaking Colombian mother and an English-speaking Scottish father - a multi-lingual household that I always saw as a huge advantage. For most, language is one of the biggest invisible barriers we experience in travel, because when travellers can’t communicate, we don’t engage. We observe, we photograph, we consume, but then move on.\n\nLive translation removes that friction almost entirely. And when you remove that friction, I think you stop passing through places and start participating in them. \n\nJust imagine the fundament...","word_count":375,"visibility":"MEMBER_NETWORK"},{"date":"2026-01-20 10:04:52","url":"https://www.lin // === UTILITY FUNCTIONS ===
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function truncate(s,n){if(!s)return'';return s.length>n?s.substring(0,n)+'...':s}
function formatNum(n){if(!n)return'0';if(n>=1000000)return(n/1000000).toFixed(1)+'M';if(n>=1000)return(n/1000).toFixed(1)+'K';return String(n)}
function getInitials(name){if(!name)return'?';return name.split(' ').map(w=>w[0]).join('').toUpperCase().substring(0,2)}
function getFreqBadge(ppw){if(ppw>=5)return'<span class="freq-badge freq-power">Power Poster</span>';if(ppw>=3)return'<span class="freq-badge freq-strong">Strong</span>';if(ppw>=1)return'<span class="freq-badge freq-moderate">Moderate</span>';return'<span class="freq-badge freq-inconsistent">Inconsistent</span>'}
const hookLabels={contrarian:'Contrarian',personal_story:'Personal Story',data_stat:'Data/Stat',news_announcement:'News',list_framework:'List/Framework',bold_claim:'Bold Claim',question:'Question',statement:'Statement'};
const ctaLabels={comment_trigger:'Comment Trigger',dm_offer:'DM Offer',link_click:'Link Click',email_cta:'Email CTA',comment_keyword:'Keyword Comment',question_engagement:'Question Engagement',no_cta:'No CTA',follow_subscribe:'Follow/Subscribe'};
const chartColors=['#00d4aa','#0ea5e9','#f97316','#a855f7','#22c55e','#ef4444','#eab308','#06b6d4','#ec4899','#8b5cf6'];

function makeBadge(cat,type){
  const labels=type==='hook'?hookLabels:ctaLabels;
  const classes=['badge-accent','badge-blue','badge-orange','badge-purple','badge-green','badge-red'];
  const keys=Object.keys(labels);
  const idx=keys.indexOf(cat);
  const cls=classes[idx%classes.length]||'badge-accent';
  return'<span class="badge '+cls+'">'+(labels[cat]||cat)+'</span>';
}

function makeDonut(data,total,size){
  size=size||160;const r=60,c=2*Math.PI*r;let offset=0;let paths='';
  data.forEach((d,i)=>{
    const pct=total>0?d.value/total:0;
    const len=pct*c;
    paths+=`<circle cx="80" cy="80" r="${r}" fill="none" stroke="${chartColors[i%chartColors.length]}" stroke-width="16" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-offset}" opacity="0.85"/>`;
    offset+=len;
  });
  return`<svg viewBox="0 0 160 160">${paths}</svg>`;
}

function makeBarChart(data,maxVal){
  if(!maxVal)maxVal=Math.max(...data.map(d=>d.value),1);
  return data.map(d=>{
    const pct=Math.round(d.value/maxVal*100);
    return`<div class="chart-bar-h"><div class="chart-bar-label">${esc(d.label)}</div><div class="chart-bar-track"><div class="chart-bar-fill" style="width:${Math.max(pct,2)}%;background:${d.color||'var(--accent)'}">${d.value}</div></div></div>`;
  }).join('');
}

// === TAB: CONTENT GAPS ===
function renderGaps(){
  const el=document.getElementById('tab-gaps');
  // Analyze gaps across all voices
  const allHooks={},allCtas={},formats={};
  let totalPosts=0,postsWithCta=0,postsNoCta=0;
  voices.forEach(v=>{
    Object.entries(v.hook_distribution||{}).forEach(([k,val])=>{allHooks[k]=(allHooks[k]||0)+val});
    Object.entries(v.cta_distribution||{}).forEach(([k,val])=>{allCtas[k]=(allCtas[k]||0)+val;if(k==='no_cta')postsNoCta+=val;else postsWithCta+=val});
    v.posts.forEach(p=>{totalPosts++;const f=p.format||'text';formats[f]=(formats[f]||0)+1});
  });
  
  const hookData=Object.entries(allHooks).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>({label:hookLabels[k]||k,value:v,color:chartColors[i%chartColors.length]}));
  const ctaData=Object.entries(allCtas).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>({label:ctaLabels[k]||k,value:v,color:chartColors[i%chartColors.length]}));
  
  // Voices with no CTA
  const noCTAVoices=voices.filter(v=>{const nc=v.cta_distribution.no_cta||0;const total=Object.values(v.cta_distribution).reduce((s,x)=>s+x,0);return nc/total>0.5});
  const strongCTAVoices=voices.filter(v=>{const ct=(v.cta_distribution.comment_trigger||0)+(v.cta_distribution.comment_keyword||0);const total=Object.values(v.cta_distribution).reduce((s,x)=>s+x,0);return ct/total>0.3});
  
  // Underrepresented hooks
  const underrep=['data_stat','question','news_announcement','list_framework'].filter(h=>!allHooks[h]||(allHooks[h]<3));

  el.innerHTML=`
    <h2 style="font-size:20px;font-weight:700;margin-bottom:20px">Content Gaps Analysis</h2>
    <div class="two-col">
      <div>
        <div class="section-title">Hook Type Distribution (All Voices)</div>
        ${makeBarChart(hookData)}
      </div>
      <div>
        <div class="section-title">CTA Type Distribution (All Voices)</div>
        ${makeBarChart(ctaData)}
      </div>
    </div>
    <div style="margin-top:24px" class="cards-grid" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">
      <div class="stat-card"><div class="stat-label">Posts With CTA</div><div class="stat-value" style="color:var(--green)">${postsWithCta}</div><div class="stat-sub">${Math.round(postsWithCta/totalPosts*100)}% of total</div></div>
      <div class="stat-card"><div class="stat-label">Posts Without CTA</div><div class="stat-value" style="color:var(--orange)">${postsNoCta}</div><div class="stat-sub">${Math.round(postsNoCta/totalPosts*100)}% of total</div></div>
      <div class="stat-card"><div class="stat-label">Total Posts</div><div class="stat-value">${totalPosts}</div></div>
    </div>
    <div class="section-title" style="margin-top:24px">Key Gaps Identified</div>
    <div class="gap-card" style="border-left:3px solid var(--orange)">
      <h4 style="color:var(--orange)">Underrepresented Hook Types</h4>
      <p>The following hook types are rarely used across tracked voices: <strong>${underrep.map(h=>hookLabels[h]||h).join(', ')}</strong>. Data/stat hooks and question-led hooks are proven high-engagement formats on LinkedIn but are underutilized in this cohort. Consider testing data-driven openings and direct questions.</p>
    </div>
    <div class="gap-card" style="border-left:3px solid var(--orange)">
      <h4 style="color:var(--orange)">CTA Usage Gap</h4>
      <p><strong>${postsNoCta} posts (${Math.round(postsNoCta/totalPosts*100)}%)</strong> have no clear CTA. Voices with strong CTAs (comment triggers, keyword comments) consistently outperform those without. ${noCTAVoices.length>0?'Voices with high no-CTA rates: <strong>'+noCTAVoices.map(v=>v.name).join(', ')+'</strong>.':''}</p>
    </div>
    <div class="gap-card" style="border-left:3px solid var(--blue)">
      <h4 style="color:var(--blue)">Format Diversity</h4>
      <p>Most voices rely heavily on text-only posts. Video content, carousels, and document formats are underrepresented. Voices who incorporate video (like Thibault's Grand Tours) see higher engagement per post. Consider diversifying content formats.</p>
    </div>
    <div class="gap-card" style="border-left:3px solid var(--green)">
      <h4 style="color:var(--green)">Strong CTA Performers</h4>
      <p>Voices with the strongest CTA game: <strong>${strongCTAVoices.map(v=>v.name).join(', ')}</strong>. Their use of comment triggers and keyword comments drives 2-3x the engagement of posts without CTAs. This is the #1 lever for Jeremy to adopt.</p>
    </div>
    <div class="gap-card" style="border-left:3px solid var(--accent)">
      <h4 style="color:var(--accent)">Posting Frequency Gap</h4>
      <p>Only ${voices.filter(v=>v.posts_per_week>=3).length} of ${voices.length} voices post 3+ times per week (the recommended minimum for thought leaders). Most are posting infrequently, missing algorithmic momentum. Consistent daily posting is the biggest untapped opportunity.</p>
    </div>
  `;
}

    {name:'The Numbered Framework',hook:'X shifts/lessons/rules/questions format',body:'Numbered list with short explanations &rarr; Each point is standalone valuable &rarr; Use arrows (\u2192) for visual flow',cta:'Ask "Which resonates most?" or "What would you add?"',example:'Holly Phillips: "7 shifts shaping guest expectations" and "30 questions in 30 days"',tip:'For Jeremy: "5 signals your destination marketing is stuck in 2020" or "7 content shifts every travel CMO needs to make in 2026"'},
    {name:'The Real-Time News React',hook:'React to breaking news or timely industry event',body:'What happened &rarr; Why it matters &rarr; Personal perspective &rarr; Industry implications &rarr; What to do about it',cta:'Tag relevant people, ask for reactions',example:'Thibault: Dubai crisis post published during the event - 69 likes, 25 comments',tip:'For Jeremy: React to travel industry news within 24 hours. "OpenAI just confirmed ads in ChatGPT. Here\'s what this means for travel brands."'}
  ];
  
  el.innerHTML=`
    <h2 style="font-size:20px;font-weight:700;margin-bottom:20px">Steal-Worthy Post Templates</h2>

// === TAB: DAILY FEED ===
function renderFeed(){
  const el=document.getElementById('tab-feed');
  const allPosts=[];
  voices.forEach(v=>{v.posts.forEach(p=>{allPosts.push({...p,voiceName:v.name,voiceSlug:v.slug})})});
  
  // Sort by date (best effort)
  allPosts.sort((a,b)=>{
    const da=new Date(a.date),db=new Date(b.date);
    if(isNaN(da))return 1;if(isNaN(db))return -1;
    return db-da;
  });
  
  // Get unique voices and hook/cta types for filters
  const voiceNames=[...new Set(allPosts.map(p=>p.voiceName))].sort();
  const hookTypes=[...new Set(allPosts.map(p=>p.hook_category))].sort();
  const ctaTypes=[...new Set(allPosts.flatMap(p=>p.cta_categories||[]))].sort();
  
  el.innerHTML=`
    <h2 style="font-size:20px;font-weight:700;margin-bottom:20px">Daily Feed</h2>
    <div class="feed-filters">
      <select class="feed-filter" id="feedVoice" onchange="filterFeed()"><option value="">All Voices</option>${voiceNames.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join('')}</select>
      <select class="feed-filter" id="feedHook" onchange="filterFeed()"><option value="">All Hooks</option>${hookTypes.map(h=>'<option value="'+h+'">'+(hookLabels[h]||h)+'</option>').join('')}</select>
      <select class="feed-filter" id="feedCta" onchange="filterFeed()"><option value="">All CTAs</option>${ctaTypes.map(c=>'<option value="'+c+'">'+(ctaLabels[c]||c)+'</option>').join('')}</select>
    </div>
    <div id="feedList"></div>
  `;
  
  window._feedPosts=allPosts;
  filterFeed();
}

function filterFeed(){
  const voice=document.getElementById('feedVoice').value;
  const hook=document.getElementById('feedHook').value;
  const cta=document.getElementById('feedCta').value;
  let posts=window._feedPosts;
  if(voice)posts=posts.filter(p=>p.voiceName===voice);
  if(hook)posts=posts.filter(p=>p.hook_category===hook);
  if(cta)posts=posts.filter(p=>(p.cta_categories||[]).includes(cta));
  
  document.getElementById('feedList').innerHTML=posts.slice(0,50).map(p=>`<div class="post-card">
    <div class="post-card-header">
      <div class="post-card-title"><a class="link" style="cursor:pointer;font-weight:600" onclick="openVoice('${p.voiceSlug}')">${esc(p.voiceName)}</a> &mdash; ${esc(truncate(p.title,60))}</div>
      <div class="post-card-eng">${p.total}</div>
    </div>
    <div class="post-card-meta">
      <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">${esc(p.date)}</span>
      ${makeBadge(p.hook_category,'hook')}
      ${(p.cta_categories||[]).map(c=>makeBadge(c,'cta')).join(' ')}
    </div>
    <div class="post-card-text">${esc(truncate(p.text||p.full_text,200))}</div>
    ${p.url?'<a href="'+esc(p.url)+'" target="_blank" class="link" style="margin-top:6px;display:inline-block">View original &rarr;</a>':''}
  </div>`).join('')||'<p style="color:var(--text-muted)">No posts match filters.</p>';
}

// === TAB: JEREMY'S FEED ===
function renderJeremy(){
  const el=document.getElementById('tab-jeremy');
  const posts=DATA.jeremy_posts;
  const totalWords=posts.reduce((s,p)=>s+p.word_count,0);
  const avgWords=Math.round(totalWords/posts.length);
  const totalPosts=posts.length;
  
  // Topic classification based on content
  const topics={};
  posts.forEach(p=>{
    const t=p.full_text.toLowerCase();
    if(t.includes('ai ')||t.includes('chatgpt')||t.includes('llm'))topics['AI & Technology']=(topics['AI & Technology']||0)+1;
    if(t.includes('destination')||t.includes('tourism'))topics['Destination Marketing']=(topics['Destination Marketing']||0)+1;
    if(t.includes('content')||t.includes('storytelling')||t.includes('social'))topics['Content Strategy']=(topics['Content Strategy']||0)+1;
    if(t.includes('luxury')||t.includes('hotel'))topics['Luxury/Hospitality']=(topics['Luxury/Hospitality']||0)+1;
    if(t.includes('brand')||t.includes('marketing'))topics['Brand & Marketing']=(topics['Brand & Marketing']||0)+1;
    if(t.includes('sustain')||t.includes('green'))topics['Sustainability']=(topics['Sustainability']||0)+1;
  });
  
  const topicData=Object.entries(topics).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>({label:k,value:v,color:chartColors[i%chartColors.length]}));
  
  el.innerHTML=`
    <h2 style="font-size:20px;font-weight:700;margin-bottom:20px">Jeremy's Feed Analysis</h2>
    <div class="cards-grid">
      <div class="stat-card"><div class="stat-label">Recent Posts</div><div class="stat-value">${totalPosts}</div></div>
      <div class="stat-card"><div class="stat-label">Avg Word Count</div><div class="stat-value">${avgWords}</div></div>
      <div class="stat-card"><div class="stat-label">Total Words</div><div class="stat-value">${formatNum(totalWords)}</div></div>
      <div class="stat-card"><div class="stat-label">Posting Cadence</div><div class="stat-value" style="font-size:16px;color:var(--blue)">~2-3/week</div></div>
    </div>
    <div class="two-col" style="margin-top:24px">
      <div>
        <div class="section-title">Topic Distribution</div>
        ${makeBarChart(topicData)}
      </div>
      <div>
        <div class="section-title">Word Count by Post</div>
        ${makeBarChart(posts.slice(0,10).map((p,i)=>({label:p.date.split(' ')[0].substring(5),value:p.word_count,color:chartColors[i%chartColors.length]})))}
      </div>
    </div>
    <div class="section-title" style="margin-top:24px">Recent Posts</div>
    ${posts.map((p,i)=>`<div class="post-card">
      <div class="post-card-header">
        <div class="post-card-title" style="font-family:var(--font-mono);font-size:12px;color:var(--text-muted)">${esc(p.date)}</div>
        <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">${p.word_count} words</div>
      </div>
      <div class="post-card-text" id="jeremy-post-${i}">${esc(p.full_text)}</div>
      <button class="expand-btn" onclick="toggleExpand('jeremy-post-${i}')">Show more</button>
      ${p.url?'<a href="'+esc(p.url)+'" target="_blank" class="link" style="margin-top:6px;display:inline-block">View on LinkedIn &rarr;</a>':''}
    </div>`).join('')}
  `;
}

// === NAVIGATION ===
function switchTab(tab){
  document.querySelectorAll('.nav-btn').forEach(b=>{
    b.classList.toggle('active',b.dataset.tab===tab);
  });
  document.querySelectorAll('.tab-content').forEach(t=>{
    t.classList.toggle('active',t.id==='tab-'+tab);
  });
  document.getElementById('mobileNav').classList.remove('open');
  
  // Render on first switch
  const tabEl=document.getElementById('tab-'+tab);
  if(!tabEl.dataset.rendered){
    tabEl.dataset.rendered='1';
    switch(tab){
      case'dashboard':renderDashboard();break;
      case'voices':renderVoices();break;
      case'gaps':renderGaps();break;
      case'templates':renderTemplates();break;
      case'feed':renderFeed();break;
      case'jeremy':renderJeremy();break;
      case'network':renderNetwork();break;
    }
  }
}

document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click',()=>switchTab(btn.dataset.tab));
});

document.getElementById('hamburgerBtn').addEventListener('click',()=>{
  document.getElementById('mobileNav').classList.toggle('open');
});

// === MODALS ===
function openModal(id){document.getElementById(id).classList.add('open')}
function closeModal(id){document.getElementById(id).classList.remove('open')}

function addVoice(){
  const name=document.getElementById('addVoiceName').value;
  const url=document.getElementById('addVoiceUrl').value;
  const company=document.getElementById('addVoiceCompany').value;
  if(!name){alert('Please enter a name');return}
  const slug=name.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');
  voices.push({slug,name,title:'',company,location:'',linkedin:url,followers:0,followers_display:'0',bio:'',posting_cadence:'',content_topics:'',unique_angle:'',avg_engagement:0,top_engagement:0,posts_per_week:0,total_posts:0,cta_distribution:{},hook_distribution:{},cta_engagement:{},hook_engagement:{},posting_days:{},content_patterns:'',top_performers:'',adaptation_ideas:'',posts:[]});
  closeModal('addModal');
  document.getElementById('tab-voices').dataset.rendered='';
  document.getElementById('tab-dashboard').dataset.rendered='';
  switchTab('voices');
  renderVoices();
  renderDashboard();
}

function deleteVoice(slug){
  deleteTarget=slug;
  const v=voices.find(x=>x.slug===slug);
  document.getElementById('deleteVoiceName').textContent=v?v.name:slug;
  openModal('deleteModal');
}

function confirmDelete(){
  if(deleteTarget){
    voices=voices.filter(v=>v.slug!==deleteTarget);
    DATA.voices=voices;
    deleteTarget=null;
    closeModal('deleteModal');
    closeProfile();
    document.getElementById('tab-voices').dataset.rendered='';
    document.getElementById('tab-dashboard').dataset.rendered='';
    renderVoices();
    renderDashboard();
  }
}

function toggleExpand(id){
  const el=document.getElementById(id);
  if(el)el.classList.toggle('expanded');
}

function filterVoices(q){
  q=q.toLowerCase();
  document.querySelectorAll('.voice-card').forEach(card=>{
    const name=card.querySelector('.voice-name').textContent.toLowerCase();
    const title=card.querySelector('.voice-title').textContent.toLowerCase();
    card.style.display=(name.includes(q)||title.includes(q))?'':'none';
  });
}

// Initial render
renderDashboard();
</script>
